name: Validate

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talon-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run backend tests
        env:
          ADMIN_API_TOKEN: test-admin-token
          CORS_ORIGINS: http://localhost:5173
        run: pytest tests/test_agent.py -q

  webchat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talon-webchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable
      - name: Install webchat dependencies
        run: pnpm install --frozen-lockfile
      - name: Build webchat
        env:
          VITE_API_URL: https://api.example.com
        run: pnpm exec tsc -b && pnpm exec vite build --outDir /tmp/talon-webchat-dist
